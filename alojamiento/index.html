<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>MonegrosBook · Alojamiento</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/mb.css">
<style>
:root{--bg:#ecebe5;--paper:#fff;--ink:#141413;--sub:#5d5b53;--hair:rgba(20,20,19,.14);--blue:#0F4270;--yel:#FABD12;--ok:#1a8a4a;--ok-soft:#dcf3e7;--terra:#BF5A33}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121211;--paper:#1c1b19;--ink:#f1efe8;--sub:#a9a69c;--hair:rgba(241,239,232,.14);--blue:#FABD12;--ok:#3ec27a;--ok-soft:#12321f}}
:root[data-theme="dark"]{--bg:#121211;--paper:#1c1b19;--ink:#f1efe8;--sub:#a9a69c;--hair:rgba(241,239,232,.14);--blue:#FABD12;--ok:#3ec27a;--ok-soft:#12321f}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "IBM Plex Sans",system-ui,Arial,sans-serif}
header{background:#0F4270;color:#fff}
header .in{max-width:1100px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.hl{display:flex;align-items:center;gap:12px}
.hl .mb-logo{width:64px;height:30px;border-radius:6px}
h1{font:800 24px/1 "Barlow Condensed",Arial,sans-serif;text-transform:uppercase;margin:0}
.hr{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px}
.gh{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:6px;padding:6px 10px;font:600 12px "IBM Plex Sans",Arial,sans-serif;text-decoration:none;cursor:pointer}
.dot{width:8px;height:8px;border-radius:50%;background:#FABD12;display:inline-block}.dot.live{background:#3fcf88}.dot.err{background:#ff7a59}
main{max-width:1100px;margin:0 auto;padding:16px 16px 40px;display:flex;flex-direction:column;gap:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.kpi{background:var(--paper);border:1px solid var(--hair);border-radius:8px;padding:10px 12px}
.kpi b{display:block;font:700 28px/1 "Barlow Condensed",sans-serif}
.kpi span{font-size:11px;color:var(--sub);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.site{background:var(--paper);border:1px solid var(--hair);border-radius:10px;overflow:hidden}
.site h2{margin:0;padding:12px 14px;font:800 20px/1 "Barlow Condensed",sans-serif;text-transform:uppercase;border-bottom:2px solid var(--blue);display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.site h2 small{font:500 12px "IBM Plex Mono",monospace;color:var(--sub);text-transform:none}
.room{display:grid;grid-template-columns:minmax(120px,190px) 60px 1fr auto;gap:10px;align-items:start;padding:10px 14px;border-top:1px solid var(--hair)}
.room:first-of-type{border-top:0}
.rn{font-weight:700;padding:2px 8px;border-radius:4px;justify-self:start}
.rn.free{background:var(--ok-soft);color:var(--ok)} .rn.busy{background:#FABD12;color:#231a00}
.pl{font:600 12px "IBM Plex Mono",monospace;color:var(--sub);padding-top:3px}
.who{display:flex;flex-direction:column;gap:4px}
.g{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}
.g .d{font:500 11px "IBM Plex Mono",monospace;color:var(--sub)}
.g .n{font-size:12px;color:var(--sub);font-style:italic}
.x{border:1px solid var(--hair);background:none;color:var(--sub);border-radius:4px;font:700 11px "IBM Plex Mono",monospace;padding:1px 7px;cursor:pointer}
.x:hover,.x.sure{border-color:var(--terra);color:var(--terra)}
.freetxt{color:var(--sub);font-size:13px}
.add{border:1px solid var(--blue);background:none;color:var(--blue);border-radius:6px;font:700 12px "IBM Plex Mono",monospace;padding:5px 10px;cursor:pointer;white-space:nowrap}
.add:hover{background:var(--blue);color:#fff}
.form{grid-column:1/-1;display:grid;grid-template-columns:2fr 1fr 1fr 2fr auto auto;gap:6px;background:var(--bg);padding:10px;border-radius:8px}
.form label{display:flex;flex-direction:column;gap:3px;font:600 11px "IBM Plex Mono",monospace;text-transform:uppercase;color:var(--sub)}
.form input{font:14px "IBM Plex Sans",Arial,sans-serif;padding:7px 8px;border:1px solid var(--hair);border-radius:5px;background:var(--paper);color:var(--ink)}
.form button{align-self:end;font:700 12px "IBM Plex Mono",monospace;text-transform:uppercase;padding:9px 12px;border-radius:5px;border:1px solid var(--hair);background:var(--paper);color:var(--ink);cursor:pointer}
.form button.pri{background:#0F4270;border-color:#0F4270;color:#fff}
.err{grid-column:1/-1;color:#d7263d;font-size:13px;min-height:0;margin:0}
.empty{padding:24px;text-align:center;color:var(--sub);border:1px dashed var(--hair);border-radius:8px;background:var(--paper)}
footer{max-width:1100px;margin:0 auto;padding:0 16px 30px;font:500 11px "IBM Plex Mono",monospace;color:var(--sub);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
@media (max-width:720px){.room{grid-template-columns:1fr auto}.pl{display:none}.who{grid-column:1/-1}.form{grid-template-columns:1fr 1fr}.form label:first-child,.form label:nth-child(4){grid-column:1/-1}}
</style>
</head><body>
<header><div class="in">
 <div class="hl"><a href="../" title="Menú"><span class="mb-logo"></span></a><div><h1>Alojamiento</h1></div></div>
 <div class="hr"><span class="dot" id="dot"></span><span id="sync">Esperando la clave…</span><button class="gh" id="refresh" type="button">Actualizar</button><a class="gh" href="../">← Menú</a><button class="gh" id="salir" type="button">Salir</button></div>
</div></header>
<main>
 <section class="kpis" id="kpis"></section>
 <section id="list"><p class="empty">Cargando…</p></section>
</main>
<footer><span>Mismos datos que el módulo ALOJAMIENTO de la app (ALOJ_SITIOS · ALOJ_HABITACIONES · ALOJ_HUESPEDES) · lo que cambies aquí sale también en la app</span><span>Operado por XG Concept</span></footer>
<script src="../assets/mb.js"></script>
<script>
(function(){
 var D={sitios:[],habitaciones:[],huespedes:[]}, openRoom=null, sure=null, busy=false, lastTs=null;
 var $=function(s){return document.querySelector(s);}, esc=MB.esc;
 function dm(s){var m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s||'');return m?m[3]+'/'+m[2]:'—';}
 function setSync(k,t){$('#dot').className='dot'+(k?' '+k:'');$('#sync').textContent=t;}
 function guests(h){return D.huespedes.filter(function(g){return g.ID_Habitacion===h.ID_Habitacion;}).sort(function(a,b){return String(a.Entrada).localeCompare(String(b.Entrada));});}
 function render(){
  var hs=D.habitaciones, plazas=hs.reduce(function(s,h){return s+(Number(h.Plazas)||0);},0), ocup=hs.filter(function(h){return guests(h).length;}).length;
  $('#kpis').innerHTML='<div class="kpi"><b>'+D.sitios.length+'</b><span>Alojamientos</span></div><div class="kpi"><b>'+hs.length+'</b><span>Habitaciones</span></div><div class="kpi"><b>'+plazas+'</b><span>Plazas</span></div><div class="kpi"><b>'+D.huespedes.length+'</b><span>Personas</span></div><div class="kpi"><b>'+(hs.length-ocup)+'</b><span>Habitaciones libres</span></div>';
  if(!D.sitios.length){$('#list').innerHTML='<p class="empty">Todavía no hay alojamientos. Se crean desde la app (ALOJAMIENTO).</p>';return;}
  var sitios=D.sitios.slice().sort(function(a,b){return (Number(a.Orden)||99)-(Number(b.Orden)||99)||String(a.Nombre_Sitio).localeCompare(String(b.Nombre_Sitio));});
  $('#list').innerHTML=sitios.map(function(s){
   var rooms=hs.filter(function(h){return h.ID_Sitio===s.ID_Sitio;}).sort(function(a,b){return String(a.Habitacion).localeCompare(String(b.Habitacion),'es',{numeric:true});});
   return '<section class="site"><h2>'+esc(s.Nombre_Sitio)+'<small>'+esc([s.Tipo,s.Localidad].filter(Boolean).join(' · '))+'</small></h2>'+
    (rooms.length?rooms.map(function(h){
     var gs=guests(h);
     var who=gs.length?gs.map(function(g){return '<div class="g"><b>'+esc(g.Nombre)+'</b><span class="d">entra '+dm(g.Entrada)+' → sale '+dm(g.Salida)+'</span>'+(g.Notas?'<span class="n">'+esc(g.Notas)+'</span>':'')+
      '<button class="x'+(sure===g.ID_Huesped?' sure':'')+'" data-del="'+esc(g.ID_Huesped)+'">'+(sure===g.ID_Huesped?'¿Quitar? Sí':'×')+'</button></div>';}).join(''):'<span class="freetxt">— libre —</span>';
     var form=openRoom===h.ID_Habitacion?'<form class="form" data-room="'+esc(h.ID_Habitacion)+'"><label>Nombre<input name="nombre" required></label><label>Entrada<input name="entrada" type="date" value="2026-11-06" required></label><label>Salida<input name="salida" type="date" value="2026-11-08" required></label><label>Comentarios<input name="notas"></label><button type="submit" class="pri">Guardar</button><button type="button" data-cancel="1">Cancelar</button><p class="err" id="ferr"></p></form>':'';
     return '<div class="room"><span class="rn '+(gs.length?'busy':'free')+'">'+esc(h.Habitacion)+'</span><span class="pl">'+esc(h.Plazas)+' pl.</span><div class="who">'+who+'</div><button class="add" data-add="'+esc(h.ID_Habitacion)+'">+ Persona</button>'+form+'</div>';
    }).join(''):'<div class="room"><span class="freetxt">Sin habitaciones</span></div>')+'</section>';
  }).join('');
 }
 async function load(manual){
  if(busy||openRoom) return; busy=true;
  try{var j=await MB.call('aloj');D=j;lastTs=j.ts;setSync('live','Al día '+MB.hm(lastTs));render();if(manual)MB.toast('Actualizado');}
  catch(e){if(e.code==='clave'){MB.logout();return;}setSync('err','Sin conexión'+(lastTs?' · datos de '+MB.hm(lastTs):''));}
  finally{busy=false;}
 }
 document.addEventListener('click',async function(ev){
  var t=ev.target.closest('button'); if(!t) return;
  if(t.id==='refresh'){load(true);return;}
  if(t.id==='salir'){MB.logout();return;}
  if(t.dataset.add){openRoom=t.dataset.add;sure=null;render();var i=document.querySelector('.form input[name=nombre]');if(i)i.focus();return;}
  if(t.dataset.cancel){openRoom=null;render();return;}
  if(t.dataset.del){
   if(sure!==t.dataset.del){sure=t.dataset.del;render();setTimeout(function(){if(sure===t.dataset.del){sure=null;render();}},4000);return;}
   sure=null;
   try{var j=await MB.call('aloj.del',{id:t.dataset.del});D=j;lastTs=j.ts;render();MB.toast('Quitado');}catch(e){MB.toast(e.message||'No se ha podido quitar');load();}
   return;
  }
 });
 document.addEventListener('submit',async function(ev){
  var f=ev.target.closest('form.form'); if(!f) return; ev.preventDefault();
  var fd=new FormData(f), err=f.querySelector('#ferr');
  err.textContent='Guardando…';
  try{
   var j=await MB.call('aloj.add',{hab:f.dataset.room,nombre:fd.get('nombre'),entrada:fd.get('entrada'),salida:fd.get('salida'),notas:fd.get('notas')});
   openRoom=null;D=j;lastTs=j.ts;render();MB.toast('Añadido');
  }catch(e){err.textContent=e.message||'No se ha guardado';}
 });
 MB.gate({need:'gestion',title:'Alojamiento'}).then(function(){load();MB.poll(load,30000);});
})();
</script>
</body></html>
