<style>html,body{margin:0}</style>
<style>
:root{

  --blue:#0F4270; --blue-ink:#ffffff; --yellow:#FABD12; --yellow-soft:#fff3cc; --terra:#BF5A33; --terra-soft:#f8e3da;
  --ok:#1d8a55; --ok-soft:#dcf3e7; --warn:#b7791f; --warn-soft:#fdf0d5; --idle:#8a96a5; --idle-soft:#e8edf2;

}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0b1119; --panel:#131c27; --panel2:#18232f; --ink:#eef2f6; --sub:#95a3b3; --hair:#253343;
    --blue:#1a5a94; --yellow:#FABD12; --yellow-soft:#3a2f0c; --terra:#e07a52; --terra-soft:#3a2016;
    --ok:#3fcf88; --ok-soft:#12321f; --warn:#f2b54a; --warn-soft:#3a2c10; --idle:#7c8a9a; --idle-soft:#1d2733;
    --chip:#1f2b38; --chip-ink:#cfdae6; --focus:#FABD12;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0b1119; --panel:#131c27; --panel2:#18232f; --ink:#eef2f6; --sub:#95a3b3; --hair:#253343;
  --blue:#1a5a94; --yellow:#FABD12; --yellow-soft:#3a2f0c; --terra:#e07a52; --terra-soft:#3a2016;
  --ok:#3fcf88; --ok-soft:#12321f; --warn:#f2b54a; --warn-soft:#3a2c10; --idle:#7c8a9a; --idle-soft:#1d2733;
  --chip:#1f2b38; --chip-ink:#cfdae6; --focus:#FABD12;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:Barlow,"Segoe UI",Arial,sans-serif;font-size:14px;line-height:1.4}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

header.top{background:#0F4270;color:#fff;padding-block:14px;padding-inline:16px}
.top-in{max-width:1320px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;justify-content:space-between}
.brand{display:flex;align-items:center;gap:14px}
.logo{background:#fff;border-radius:6px;padding:4px 9px;display:flex}
.logo img{height:26px;width:auto;display:block}
h1{font-family:"Barlow Condensed",Arial,sans-serif;font-weight:800;text-transform:uppercase;letter-spacing:.03em;font-size:24px;margin:0;line-height:1}
.h1sub{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;opacity:.75;margin-top:4px}
.sync{display:flex;align-items:center;gap:10px;font-size:12px;flex-wrap:wrap}
.dot{width:8px;height:8px;border-radius:50%;background:#FABD12;display:inline-block}
.dot.live{background:#3fcf88;box-shadow:0 0 0 3px rgba(63,207,136,.25)}

.btn-ghost{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:6px;padding:6px 11px;font-weight:600;font-size:12px}
.btn-ghost:hover{background:rgba(255,255,255,.22)}
.top a{color:#fff}

main{max-width:1320px;margin:0 auto;padding-block:16px 40px;padding-inline:16px;display:flex;flex-direction:column;gap:14px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px}
.kpi{background:var(--panel);border:1px solid var(--hair);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;text-align:left}
button.kpi:hover{border-color:var(--blue)}
.kpi .n{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.kpi .l{font-size:11px;color:var(--sub);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.kpi.ok .n{color:var(--ok)} .kpi.warn .n{color:var(--terra)}
.kpi .bar{height:4px;border-radius:2px;background:var(--idle-soft);margin-top:6px;overflow:hidden}
.kpi .bar i{display:block;height:100%;background:var(--ok)}

.days{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.day{background:var(--panel);border:1px solid var(--hair);border-radius:8px;padding:8px 12px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.day b{font-family:"Barlow Condensed",sans-serif;font-size:15px;text-transform:uppercase;letter-spacing:.04em}
.day span{font-size:12px;color:var(--sub)}
.day .mono{font-size:13px;color:var(--ink)}

.bar-tabs{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.tabs{display:inline-flex;background:var(--panel);border:1px solid var(--hair);border-radius:8px;padding:3px}
.tabs button{border:0;background:none;padding:7px 14px;border-radius:6px;font-weight:700;font-family:"Barlow Condensed",sans-serif;font-size:15px;letter-spacing:.04em;text-transform:uppercase;color:var(--sub)}
.tabs button[aria-selected="true"]{background:var(--blue);color:#fff}
.search{flex:1;min-width:180px;max-width:360px;background:var(--panel);border:1px solid var(--hair);border-radius:8px;padding:8px 12px}

.filters{display:flex;flex-direction:column;gap:6px;background:var(--panel);border:1px solid var(--hair);border-radius:8px;padding:10px 12px}
.frow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.frow .lab{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--sub);font-weight:700;width:74px;flex-shrink:0}
.fchip{border:1px solid var(--hair);background:var(--panel2);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;color:var(--chip-ink)}
.fchip[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.fchip .c{opacity:.65;margin-left:4px;font-family:"IBM Plex Mono",monospace;font-size:11px}
.clear{border:0;background:none;color:var(--terra);font-weight:700;font-size:12px;margin-left:auto}

.banner{border-radius:8px;padding:10px 14px;font-size:13px;border:1px solid var(--hair);background:var(--warn-soft);color:var(--ink)}
.banner.err{background:var(--terra-soft)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px;align-items:start}
.card{background:var(--panel);border:1px solid var(--hair);border-radius:10px;display:flex;flex-direction:column;overflow:hidden}
.card.st-asig{border-color:color-mix(in srgb,var(--warn) 50%,var(--hair))}
.card.st-conf{border-color:color-mix(in srgb,var(--ok) 55%,var(--hair))}
.chead{padding:11px 13px 8px;display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.name{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:19px;line-height:1.05;text-transform:uppercase;letter-spacing:.01em}
.meta{font-size:12px;color:var(--sub);margin-top:3px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.meta .tel{user-select:all;color:var(--ink)}
.copy{border:0;background:none;color:var(--blue);font-size:11px;font-weight:700;padding:0}
:root[data-theme="dark"] .copy{color:var(--yellow)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .copy{color:var(--yellow)}}
.pill{flex-shrink:0;font-family:"IBM Plex Mono",monospace;font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border-radius:999px;white-space:nowrap}
.pill.none{background:var(--idle-soft);color:var(--sub)}
.pill.asig{background:var(--warn-soft);color:var(--warn)}
.pill.conf{background:var(--ok-soft);color:var(--ok)}
.cbody{padding:0 13px 10px;display:flex;flex-direction:column;gap:8px}
.drow{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.d{text-align:center;font-size:11px;font-weight:700;letter-spacing:.04em;padding:4px 0;border-radius:4px;background:var(--idle-soft);color:var(--idle);text-transform:uppercase}
.d.on{background:var(--blue);color:#fff}
.rowlab{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--sub);font-weight:700;margin-bottom:3px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:11.5px;padding:2px 8px;border-radius:4px;background:var(--chip);color:var(--chip-ink);font-weight:600}
.chip.veh{background:transparent;border:1px solid var(--hair)}
.chip.veh.strong{border-color:var(--blue);color:var(--ink)}
.chip.veh.nov{border-style:dashed;color:var(--terra);border-color:var(--terra)}
.chip.sp{background:var(--yellow);color:#231a00}
.obs{font-size:12.5px;color:var(--ink);background:var(--panel2);border-left:3px solid var(--terra);padding:6px 9px;border-radius:0 4px 4px 0}
.dup{font-size:11px;color:var(--sub)}
.cfoot{border-top:1px solid var(--hair);background:var(--panel2);padding:9px 13px;display:flex;flex-direction:column;gap:7px}
.asgs{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.asg{display:inline-flex;align-items:center;gap:6px;background:var(--blue);color:#fff;border-radius:5px;padding:3px 4px 3px 8px;font-size:12px;font-weight:600}
.asg .dd{font-family:"IBM Plex Mono",monospace;font-size:10px;background:rgba(255,255,255,.18);padding:1px 5px;border-radius:3px}
.asg button{border:0;background:rgba(255,255,255,.14);color:#fff;border-radius:3px;width:18px;height:18px;line-height:1;padding:0;font-size:13px}
.asg button:hover{background:rgba(255,255,255,.3)}
.sugg{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.sugg .lab{font-size:10.5px;color:var(--sub);margin-right:2px}
.sbtn{border:1px dashed var(--blue);background:transparent;color:var(--ink);border-radius:4px;font-size:11px;font-weight:600;padding:1px 7px}
.sbtn:hover{background:var(--blue);color:#fff;border-style:solid}
.sbtn.top{border-style:solid;border-color:var(--yellow);background:var(--yellow-soft);color:var(--ink)}
.sbtn.top:hover{background:var(--yellow);color:#231a00}
.sbtn.done{opacity:.45;cursor:default;border-style:solid}
.sugg .why{flex-basis:100%;font-size:11px;color:var(--sub);font-style:italic}
.actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--hair);background:var(--panel);border-radius:6px;padding:5px 10px;font-size:12px;font-weight:700}
.btn.pri{background:var(--yellow);border-color:var(--yellow);color:#231a00}
.btn.okb[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.addrow{display:flex;gap:6px;flex-wrap:wrap}
.addrow select{background:var(--panel);border:1px solid var(--hair);border-radius:6px;padding:5px 6px;font-size:12px;max-width:100%}
.addrow select.area{flex:1;min-width:150px}

.areas{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;align-items:start}
.acard{background:var(--panel);border:1px solid var(--hair);border-radius:10px;padding:11px 13px;display:flex;flex-direction:column;gap:8px}
.acard.empty{border-style:dashed}
.ahead{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.acode{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--sub)}
.aname{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:16px;text-transform:uppercase;line-height:1.1}
.aresp{font-size:11.5px;color:var(--sub)}
.acount{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:26px;line-height:1;font-variant-numeric:tabular-nums}
.acard.empty .acount{color:var(--terra)}
.alist{display:flex;flex-direction:column;gap:3px}
.aitem{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:3px 0;border-top:1px solid var(--hair)}
.aitem .dd{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--sub)}
.aitem.conf::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ok);align-self:center;margin-right:-2px}
.aitem .nm{flex:1}
.aempty{font-size:12px;color:var(--terra);font-weight:600}
.acons{font-size:11.5px;color:var(--sub);border-top:1px dashed var(--hair);padding-top:6px}
.acons .lab{font-weight:700;text-transform:uppercase;letter-spacing:.05em;font-size:10px}
.empty-state{padding:30px;text-align:center;color:var(--sub);background:var(--panel);border:1px dashed var(--hair);border-radius:10px}
footer{max-width:1320px;margin:0 auto;padding-inline:16px;padding-block:0 30px;font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--sub);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:6px;font-size:13px;font-weight:600;z-index:9}
@media (max-width:560px){
  .days{grid-template-columns:repeat(2,1fr)}
  .frow .lab{width:100%}
  h1{font-size:20px}
}
@media (prefers-reduced-motion:no-preference){.card,.acard{transition:border-color .15s}}
</style>

<script>
(function(){
const AREAS=[
["A01","Inscripciones / Check-in","Laia Galindo"],["A02","Verificaciones Técnicas (Paddock)","Josep Piñol"],["A03","Mini Track","Cesc Piñol"],
["A04","Zona de Salida (Arco de Meta)","Jordi Viladoms"],["A05","Llegada y Podium Finisher","Laia Galindo"],["A06","Zona Expo / Comercial","Xavi Francés"],
["A07","Avituallamiento / CP Monegros Festival","Josep Piñol"],["A08","CP Mequinenza (Avituallamiento Plaza)","Jordi Larregola"],["A09","Desmontaje y Limpieza Final","Xavi Galindo"],
["A10","Control de Paso (CP) OnRoad Rápido","Rosa Arbones"],["A11","CP OnRoad Rápido · CP OnRoad 2","Benito Galindo"],["A12","Parking Motos (Paddock)","Sergio"],
["A13","Briefing / Presentación Oficial","Xavi Galindo"],["A14","Media, Redes Sociales y Contenido «Inside»","Noemí Larregola"],["A15","Cena Final y Tardeo (Foodtrucks)","Laia Galindo"],
["A16","Post-Evento y Cierre de Edición","Xavi Galindo"],["A17","Centro de Mando (HQ/PCO) y Logística Interna","Jordi Viladoms"],["A18","Vigilancia y Seguridad","Xavi Galindo"],
["A19","Ruta Off-Road","Jordi Viladoms"],["A20","Equipo Médico","Anna Comesolives"],["A21","Ruta On-Road","Jordi Viladoms"]];
const SHORT={A01:"Check-in",A02:"Verificaciones",A03:"Mini Track",A04:"Salida",A05:"Llegada",A06:"Expo",A07:"CP Festival",A08:"CP Mequinenza",A09:"Desmontaje",A10:"CP OnRoad 1",A11:"CP OnRoad 2",A12:"Parking",A13:"Briefing",A14:"Media",A15:"Cena",A16:"Post-evento",A17:"HQ / PCO",A18:"Seguridad",A19:"Ruta Off",A20:"Médico",A21:"Ruta On"};
const AREA=Object.fromEntries(AREAS.map(a=>[a[0],{c:a[0],n:a[1],r:a[2],s:SHORT[a[0]]}]));
const DAYS=[["pre","Previos","P"],["vie","Viernes","V"],["sab","Sábado","S"],["dom","Domingo","D"]];
const DAYLBL={pre:"PREV",vie:"VIE",sab:"SÁB",dom:"DOM",all:"TODO"};
// task preferences in the form -> short label + suggested areas
const TASKS=[
 {k:"insc",re:/inscripciones/i,l:"Inscripciones",a:["A01"]},
 {k:"veri",re:/verificaciones/i,l:"Verificaciones",a:["A02"]},
 {k:"expo",re:/montaje/i,l:"Montaje/Expo",a:["A06","A09"]},
 {k:"sal",re:/salida \(/i,l:"Salida",a:["A04"]},
 {k:"ruta",re:/ayuda en ruta/i,l:"Ayuda en ruta",a:["A19","A21"]},
 {k:"cp",re:/controles de paso/i,l:"Controles de paso",a:["A10","A11","A07","A08"]},
 {k:"rb",re:/roadbooks/i,l:"Roadbooks",a:["A01"]},
 {k:"park",re:/parking/i,l:"Parking",a:["A12"]},
 {k:"lleg",re:/llegada/i,l:"Llegada",a:["A05"]},
 {k:"cena",re:/cena/i,l:"Cena",a:["A15"]},
 {k:"it",re:/inform[aá]tica/i,l:"Informática",a:["A17"],sp:1},
 {k:"foto",re:/fotos/i,l:"Foto",a:["A14"],sp:1},
 {k:"video",re:/v[ií]deo/i,l:"Vídeo",a:["A14"],sp:1},
 {k:"dron",re:/dron/i,l:"Dron",a:["A14"],sp:1},
 {k:"san",re:/sanitari/i,l:"Sanitario",a:["A20"],sp:1}];
const VEH=[
 {k:"4x4",re:/4x4/i,l:"4x4 / SUV",strong:1},
 {k:"furgo",re:/furgoneta/i,l:"Furgoneta",strong:1},
 {k:"trail",re:/trail|enduro/i,l:"Moto trail",strong:1},
 {k:"moto",re:/moto de carretera/i,l:"Moto carretera"},
 {k:"coche",re:/turismo/i,l:"Turismo"},
 {k:"nov",re:/no dispongo/i,l:"Sin vehículo",nov:1}];


// ---- consejo de encaje (criterio operativa XG): puntúa cada área y devuelve las 3 mejores con el porqué
const NO_SUG=new Set(["A13","A16"]); // dirección
function suggest(v){
 const sc={}, why={};
 const add=(c,p,w)=>{if(NO_SUG.has(c))return;sc[c]=(sc[c]||0)+p;if(w&&p>0){(why[c]=why[c]||new Set()).add(w);}};
 AREAS.forEach(a=>{const r=slug(a[2]);if(r.length>5&&(v.id.startsWith(r)||r.startsWith(v.id)))add(a[0],25,"ya es responsable del área");});
 v.tasks.forEach(t=>t.a.forEach(c=>add(c,t.sp?8:5,t.sp?"aporta "+t.l.toLowerCase():"quiere "+t.l.toLowerCase())));
 const has=k=>v.veh.some(x=>x.k===k);
 if(has("trail")){add("A19",4,"moto trail");add("A21",1);["A10","A11","A07","A08"].forEach(c=>add(c,2,"moto trail"));}
 if(has("4x4")){["A07","A08"].forEach(c=>add(c,3,"tiene 4x4"));add("A17",2,"tiene 4x4");add("A18",2,"tiene 4x4");add("A19",1);}
 if(has("furgo")){add("A17",3,"furgoneta");add("A09",2,"furgoneta");add("A06",2,"furgoneta");}
 if(has("nov")){["A01","A05","A15","A12"].forEach(c=>add(c,3,"sin vehículo: recinto"));add("A06",1);["A19","A21","A08","A10","A11","A07"].forEach(c=>add(c,-6));}
 if(has("coche")&&!has("4x4")&&!has("trail")){["A19","A08"].forEach(c=>add(c,-3));["A01","A05","A15","A12","A06"].forEach(c=>add(c,1));}
 const D=v.days;
 if(D.sab){["A04","A05","A07","A08","A10","A11","A12","A15","A17","A18","A19","A20","A21","A14"].forEach(c=>add(c,1));}
 else{["A04","A05","A07","A08","A10","A11","A15","A19","A20","A21"].forEach(c=>add(c,-7));}
 if(D.vie){["A01","A02","A06","A12"].forEach(c=>add(c,1,"viene el viernes"));}else{["A01","A02"].forEach(c=>add(c,-6));}
 if(D.dom){add("A09",3,"puede el domingo");}else add("A09",-6);
 if(D.pre){add("A19",2,"días previos: revisar ruta");add("A21",2,"días previos: revisar ruta");add("A06",1,"días previos: montaje");}
 const o=(v.obs||"").toLowerCase();
 if(/protecci/.test(o)){add("A18",9,"Protección Civil");add("A20",3,"Protección Civil");}
 if(/rodibook/.test(o)){add("A17",5,"staff Rodibook");add("A01",3,"staff Rodibook");}
 if(/terreno|fraga/.test(o)){add("A19",5,"conoce el terreno");}
 if(/cami[oó]n/.test(o)){add("A17",3,"camión");add("A09",3,"camión");add("A06",2,"camión");}
 if(/no puedo.*larga|pierna/.test(o)){["A19","A21","A09"].forEach(c=>add(c,-5));add("A01",2,"tarea sin andar");add("A17",2,"tarea sin andar");}
 if(/ninguna experiencia|no experiencia/.test(o)){["A19","A02"].forEach(c=>add(c,-3));add("A01",2,"sin experiencia: tarea guiada");add("A15",2,"sin experiencia: tarea guiada");}
 if(/15:00|16:00/.test(o)){add("A01",1);add("A15",1);}
 // si no marcó ninguna tarea: reparto por lo que sabemos
 if(!v.tasks.length){add("A01",1);add("A15",1);add("A12",1);}
 return Object.entries(sc).filter(([c,p])=>p>0).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0])).slice(0,3)
  .map(([c,p])=>({c,p,why:[...(why[c]||[])].slice(0,3).join(", ")}));
}

let vols=[], asg={}, st={tab:"vol",q:"",estado:null,day:null,veh:null,task:null}, openAdd=null;
let dbOk=false, lastSync=null;
try{const t=localStorage.getItem("mbv_tab"); if(t==="area")st.tab="area";}catch(e){}

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const slug=s=>String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,80)||"sin-nombre";
const title=s=>String(s||"").trim().toLowerCase().replace(/(^|[\s\-'’])(\p{L})/gu,(m,a,b)=>a+b.toUpperCase());
function toast(t){const e=$("#toast");e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,2200);}

function parseCSV(txt){const rows=[];let row=[],f="",q=false;for(let i=0;i<txt.length;i++){const c=txt[i];
 if(q){if(c==='"'){if(txt[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}
 else if(c==='"')q=true; else if(c===','){row.push(f);f="";} else if(c==='\n'||c==='\r'){if(c==='\r'&&txt[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f="";} else f+=c;}
 if(f!==""||row.length){row.push(f);rows.push(row);} return rows.filter(r=>r.some(x=>x.trim()!==""));}
function b64utf8(b){const bin=atob(b.replace(/\s/g,""));const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new TextDecoder("utf-8").decode(u);}

function buildVols(rows){
 rows=(rows||[]).filter(r=>r.some(x=>String(x).trim()!=="")); if(!rows.length) return [];
 const H=rows[0].map(h=>h.trim().toLowerCase());
 const col=(fn)=>H.findIndex(fn);
 const iName=col(h=>h.startsWith("nombre")), iTel=col(h=>h==="tel"||h.startsWith("tel")), iMail=col(h=>h.includes("mail")),
  iTalla=col(h=>h.includes("talla")), iFechas=col(h=>h.includes("fechas")), iTareas=col(h=>h.includes("tareas")),
  iVeh=col(h=>h.includes("veh")), iObs=col(h=>h.includes("observ")), iTs=col(h=>h.includes("marca temporal"));
 const map=new Map();
 rows.slice(1).forEach((r,idx)=>{
  const name=(r[iName]||"").trim(); if(!name) return;
  const id=slug(name);
  const fechas=r[iFechas]||"", tareas=r[iTareas]||"", veh=r[iVeh]||"";
  let obs=(r[iObs]||"").trim(); if(/^(ninguna|no|-)$/i.test(obs)) obs="";
  const v={id,name:title(name),tel:(r[iTel]||"").trim(),mail:(r[iMail]||"").trim(),talla:(r[iTalla]||"").trim(),ts:(r[iTs]||"").trim(),order:idx,
   days:{pre:/previos/i.test(fechas),vie:/viernes/i.test(fechas),sab:/s[aá]bado/i.test(fechas),dom:/domingo/i.test(fechas)},
   tasks:TASKS.filter(t=>t.re.test(tareas)),veh:VEH.filter(x=>x.re.test(veh)),obs,dupes:0};
  const prev=map.get(id); if(prev){v.dupes=prev.dupes+1;} map.set(id,v);
 });
 return [...map.values()];
}
function status(v){const a=asg[v.id]; if(!a||!(a.items||[]).length) return "none"; return a.confirmado?"conf":"asig";}
function specials(v){return v.tasks.filter(t=>t.sp);}

function passes(v,skip){
 if(skip!=="estado"&&st.estado&&status(v)!==st.estado) return false;
 if(skip!=="day"&&st.day&&!v.days[st.day]) return false;
 if(skip!=="veh"&&st.veh&&!v.veh.some(x=>x.k===st.veh)) return false;
 if(skip!=="task"&&st.task&&!v.tasks.some(t=>t.k===st.task)) return false;
 if(st.q){const q=slug(st.q).replace(/-/g," "),hay=slug([v.name,v.tel,v.mail,v.obs,(asg[v.id]?.items||[]).map(i=>i.area).join(" ")].join(" ")).replace(/-/g," ");
  if(!hay.includes(q)) return false;}
 return true;}

function renderKpis(){
 const n=vols.length, a=vols.filter(v=>status(v)!=="none").length, c=vols.filter(v=>status(v)==="conf").length;
 const cnt=k=>vols.filter(v=>v.veh.some(x=>x.k===k)).length;
 const pct=n?Math.round(a/n*100):0;
 $("#kpis").innerHTML=`
 <div class="kpi"><span class="n">${n}</span><span class="l">Voluntarios</span></div>
 <button type="button" class="kpi ok" data-est="asig"><span class="n">${a}</span><span class="l">Asignados · ${pct}%</span><span class="bar"><i style="width:${pct}%"></i></span></button>
 <button type="button" class="kpi" data-est="conf"><span class="n">${c}</span><span class="l">Confirmados</span></button>
 <button type="button" class="kpi warn" data-est="none"><span class="n">${n-a}</span><span class="l">Sin asignar</span></button>
 <button type="button" class="kpi" data-veh="4x4"><span class="n">${cnt("4x4")}</span><span class="l">Con 4x4</span></button>
 <button type="button" class="kpi" data-veh="trail"><span class="n">${cnt("trail")}</span><span class="l">Moto trail</span></button>
 <button type="button" class="kpi" data-veh="furgo"><span class="n">${cnt("furgo")}</span><span class="l">Furgoneta</span></button>
 <button type="button" class="kpi warn" data-veh="nov"><span class="n">${cnt("nov")}</span><span class="l">Sin vehículo</span></button>`;
 $("#days").innerHTML=DAYS.map(([k,l])=>{const tot=vols.filter(v=>v.days[k]).length;
  const as=vols.filter(v=>(asg[v.id]?.items||[]).some(i=>i.dia===k||i.dia==="all")).length;
  return `<div class="day"><b>${l}</b><span>disp. <span class="mono">${tot}</span> · asig. <span class="mono">${as}</span></span></div>`}).join("");
}
function fchip(group,key,label,count){const on=st[group]===key;return `<button type="button" class="fchip" aria-pressed="${on}" data-g="${group}" data-k="${key}">${esc(label)}<span class="c">${count}</span></button>`;}
function renderFilters(){
 const base=g=>vols.filter(v=>passes(v,g));
 const est=base("estado"),dd=base("day"),vh=base("veh"),tk=base("task");
 const any=st.estado||st.day||st.veh||st.task||st.q;
 $("#filters").innerHTML=`
 <div class="frow"><span class="lab">Estado</span>${fchip("estado","none","Sin asignar",est.filter(v=>status(v)==="none").length)}${fchip("estado","asig","Asignado",est.filter(v=>status(v)==="asig").length)}${fchip("estado","conf","Confirmado",est.filter(v=>status(v)==="conf").length)}${any?'<button type="button" class="clear" id="clr">Quitar filtros</button>':''}</div>
 <div class="frow"><span class="lab">Día</span>${DAYS.map(([k,l])=>fchip("day",k,l,dd.filter(v=>v.days[k]).length)).join("")}</div>
 <div class="frow"><span class="lab">Vehículo</span>${VEH.map(x=>fchip("veh",x.k,x.l,vh.filter(v=>v.veh.some(y=>y.k===x.k)).length)).join("")}</div>
 <div class="frow"><span class="lab">Quiere</span>${TASKS.map(t=>fchip("task",t.k,t.l,tk.filter(v=>v.tasks.some(y=>y.k===t.k)).length)).join("")}</div>`;
}
function areaOpts(sel){return AREAS.map(a=>`<option value="${a[0]}"${a[0]===sel?" selected":""}>${a[0]} · ${esc(a[1])}</option>`).join("");}
function dayOpts(v){const av=DAYS.filter(d=>v.days[d[0]]);const list=av.length?av:DAYS;return list.map(d=>`<option value="${d[0]}">${d[1]}</option>`).join("")+`<option value="all">Todo el evento</option>`;}
function card(v){
 const s=status(v), a=asg[v.id]||{}, items=a.items||[];
 const pill={none:'<span class="pill none">Sin asignar</span>',asig:'<span class="pill asig">Asignado</span>',conf:'<span class="pill conf">✓ Confirmado</span>'}[s];
 const sp=specials(v);
 const norm=v.tasks.filter(t=>!t.sp);
 const sugAll=suggest(v); const sug=sugAll.map(x=>x.c);
 const firstDay=(DAYS.find(d=>v.days[d[0]])||["all"])[0];
 return `<article class="card st-${s}" data-id="${v.id}">
  <div class="chead"><div><div class="name">${esc(v.name)}</div>
   <div class="meta">${v.tel?`<span class="tel mono">${esc(v.tel)}</span><button type="button" class="copy" data-copy="${esc(v.tel)}">Copiar</button>`:""}${v.talla?`<span>Talla <b>${esc(v.talla)}</b></span>`:""}</div></div>${pill}</div>
  <div class="cbody">
   <div><div class="rowlab">Disponible</div><div class="drow">${DAYS.map(([k,l])=>`<span class="d${v.days[k]?" on":""}" title="${l}">${l.slice(0,3)}</span>`).join("")}</div></div>
   <div><div class="rowlab">Vehículo</div><div class="chips">${v.veh.length?v.veh.map(x=>`<span class="chip veh${x.strong?" strong":""}${x.nov?" nov":""}">${esc(x.l)}</span>`).join(""):'<span class="chip veh">No indicado</span>'}</div></div>
   ${sp.length?`<div><div class="rowlab">Aporta</div><div class="chips">${sp.map(t=>`<span class="chip sp">${esc(t.l)}</span>`).join("")}</div></div>`:""}
   ${norm.length?`<div><div class="rowlab">Quiere hacer</div><div class="chips">${norm.map(t=>`<span class="chip">${esc(t.l)}</span>`).join("")}</div></div>`:""}
   ${v.obs?`<div class="obs">${esc(v.obs)}</div>`:""}
   ${v.dupes?`<div class="dup">Respondió ${v.dupes+1} veces · se muestra la última</div>`:""}
  </div>
  <div class="cfoot">
   ${items.length?`<div class="asgs">${items.map((it,ix)=>`<span class="asg" title="${esc(AREA[it.area]?.n||it.area)}"><span class="dd">${DAYLBL[it.dia]||""}</span>${esc(it.area)} · ${esc(AREA[it.area]?.s||"")}<button type="button" aria-label="Quitar asignación" data-rm="${ix}">×</button></span>`).join("")}</div>`:""}
   ${openAdd===v.id?`<div class="addrow"><select class="area" id="sel-area-${v.id}" aria-label="Área">${areaOpts(sug[0]||"A01")}</select><select id="sel-day-${v.id}" aria-label="Día">${dayOpts(v)}</select><button type="button" class="btn pri" data-ok="1">Asignar</button><button type="button" class="btn" data-cancel="1">Cancelar</button></div>`:
   `<div class="sugg"><span class="lab">Encaja en:</span>${sugAll.length?sugAll.map((x,i)=>{const done=items.some(it=>it.area===x.c);return `<button type="button" class="sbtn${i===0?" top":""}${done?" done":""}" data-quick="${x.c}" data-day="${firstDay}" title="${esc(AREA[x.c].n)}${x.why?" · "+esc(x.why):""}"${done?" disabled":""}>${i===0?"★ ":""}${x.c} ${esc(AREA[x.c].s)}</button>`}).join("")+(sugAll[0]&&sugAll[0].why?`<span class="why">${esc(sugAll[0].why)}</span>`:""):'<span class="why">sin datos suficientes: tú decides</span>'}</div>
   <div class="actions"><button type="button" class="btn pri" data-add="1"${dbOk?"":" disabled"}>+ Asignar</button>${items.length?`<button type="button" class="btn okb" data-conf="1" aria-pressed="${!!a.confirmado}">${a.confirmado?"✓ Confirmado":"Marcar confirmado"}</button>`:""}</div>`}
  </div></article>`;
}
function renderAreas(){
 const by={}; AREAS.forEach(a=>by[a[0]]=[]);
 const cons={}; AREAS.forEach(a=>cons[a[0]]=[]);
 vols.forEach(v=>{if(!passes(v))return;(asg[v.id]?.items||[]).forEach(it=>{(by[it.area]=by[it.area]||[]).push({v,it,conf:asg[v.id].confirmado});});
  if(status(v)==="none"){const s0=suggest(v)[0];if(s0)cons[s0.c].push(v);}});
 const order={pre:0,vie:1,sab:2,dom:3,all:4};
 return `<div class="areas">${AREAS.map(([c,n,r])=>{const L=(by[c]||[]).sort((x,y)=>order[x.it.dia]-order[y.it.dia]||x.v.name.localeCompare(y.v.name));
  return `<div class="acard${L.length?"":" empty"}"><div class="ahead"><div><div class="acode">${c} · resp. ${esc(r)}</div><div class="aname">${esc(n)}</div></div><div class="acount">${L.length}</div></div>
  ${L.length?`<div class="alist">${L.map(x=>`<div class="aitem${x.conf?" conf":""}"><span class="nm">${esc(x.v.name)}</span><span class="dd">${DAYLBL[x.it.dia]||""}${x.v.veh.some(y=>y.strong)?" · "+esc(x.v.veh.find(y=>y.strong).l):""}</span></div>`).join("")}</div>`:'<div class="aempty">Sin voluntarios asignados</div>'}
  ${cons[c].length?`<div class="acons"><span class="lab">Consejo (sin asignar):</span> ${cons[c].map(v=>esc(v.name)).join(" · ")}</div>`:""}</div>`}).join("")}</div>`;
}
function render(){
 renderKpis(); renderFilters();
 $("#tab-vol").setAttribute("aria-selected",st.tab==="vol"); $("#tab-area").setAttribute("aria-selected",st.tab==="area");
 if(!vols.length){ $("#view").innerHTML=`<div class="empty-state">${lastSync?"El formulario todavía no tiene respuestas.":"Cargando respuestas del formulario…"}</div>`; return; }
 if(st.tab==="area"){ $("#view").innerHTML=renderAreas(); return; }
 const rank={none:0,asig:1,conf:2};
 const L=vols.filter(v=>passes(v)).sort((a,b)=>rank[status(a)]-rank[status(b)]||a.name.localeCompare(b.name));
 $("#view").innerHTML=L.length?`<div class="grid">${L.map(card).join("")}</div>`:'<div class="empty-state">Nadie cumple estos filtros.</div>';
}

// ---- persistence
async function saveAsg(id,patch){
 if(!dbOk){toast("Sin conexión: no se ha guardado");return;}
 const v=vols.find(x=>x.id===id); const cur=asg[id]||{items:[],confirmado:false};
 const next={nombre:v?.name||id,items:cur.items||[],confirmado:!!cur.confirmado,...patch};
 if(!next.items.length) next.confirmado=false;
 asg[id]=next; render();
 try{ const j=await MB.call("asig.set",{id,nombre:next.nombre,items:next.items,confirmado:next.confirmado}); asg=j.asig; render(); }
 catch(e){ toast(e.code==="permiso"?"Esta clave no puede asignar":"No se ha guardado. Prueba otra vez."); load(); }
}

// ---- events
document.addEventListener("click",async ev=>{
 const t=ev.target.closest("button"); if(!t) return;
 if(t.id==="tab-vol"||t.id==="tab-area"){st.tab=t.id==="tab-vol"?"vol":"area";try{localStorage.setItem("mbv_tab",st.tab)}catch(e){};render();return;}
 if(t.id==="refresh"){load(true);return;}
 if(t.id==="salir"){MB.logout();return;}
 if(t.id==="clr"){st.estado=st.day=st.veh=st.task=null;st.q="";$("#q").value="";render();return;}
 if(t.dataset.g){const g=t.dataset.g;st[g]=st[g]===t.dataset.k?null:t.dataset.k;render();return;}
 if(t.dataset.est){st.estado=st.estado===t.dataset.est?null:t.dataset.est;st.tab="vol";render();return;}
 if(t.dataset.veh){st.veh=st.veh===t.dataset.veh?null:t.dataset.veh;st.tab="vol";render();return;}
 if(t.dataset.copy!==undefined){const val=t.dataset.copy;try{await navigator.clipboard.writeText(val);toast("Teléfono copiado")}catch(e){toast(val)};return;}
 const c=t.closest(".card"); if(!c) return; const id=c.dataset.id; const cur=asg[id]||{items:[]};
 if(t.dataset.add){openAdd=id;render();$("#sel-area-"+id)?.focus();return;}
 if(t.dataset.cancel){openAdd=null;render();return;}
 if(t.dataset.ok){const area=$("#sel-area-"+id).value,dia=$("#sel-day-"+id).value;openAdd=null;
  if((cur.items||[]).some(i=>i.area===area&&i.dia===dia)){render();return;}
  await saveAsg(id,{items:[...(cur.items||[]),{area,dia}]});toast("Asignado a "+area);return;}
 if(t.dataset.quick){if(!dbOk){toast("Sin conexión: no se ha guardado");return;}await saveAsg(id,{items:[...(cur.items||[]),{area:t.dataset.quick,dia:t.dataset.day}]});toast("Asignado a "+t.dataset.quick);return;}
 if(t.dataset.rm!==undefined){const items=(cur.items||[]).filter((_,i)=>i!==+t.dataset.rm);await saveAsg(id,{items});return;}
 if(t.dataset.conf){await saveAsg(id,{confirmado:!cur.confirmado});return;}
});
let qt; $("#q").addEventListener("input",e=>{clearTimeout(qt);qt=setTimeout(()=>{st.q=e.target.value.trim();render();},150);});

// ---- sync status
function setSync(kind,txt){$("#dot").className="dot"+(kind==="live"?" live":kind==="err"?" err":"");$("#syncTxt").textContent=txt;}
function fmt(ts){const d=new Date(ts);return d.toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit"});}
function banner(html,err){$("#banners").innerHTML=html?`<div class="banner${err?" err":""}">${html}</div>`:"";}
let loading=false;
async function load(manual){
 if(loading) return; loading=true;
 if(manual) setSync("","Actualizando…");
 try{
  const j=await MB.call("vol");
  vols=buildVols(j.rows); asg=j.asig||{}; lastSync=j.ts; dbOk=true;
  setSync("live",`${vols.length} voluntarios · al día ${fmt(lastSync)}`); banner("");
  if(!openAdd) render();
  if(manual) toast("Datos actualizados");
 }catch(e){
  if(e.code==="clave"){MB.logout();return;}
  setSync("err",lastSync?`Sin conexión · últimos datos ${fmt(lastSync)}`:"Sin datos");
  banner("No se ha podido leer la hoja. Pulsa «Actualizar ahora»; si sigue igual, avisa a Claude.",true);
 }finally{loading=false;}
}

render();
MB.gate({need:"gestion",title:"Voluntarios"}).then(()=>{ load(); MB.poll(load,30000); });
})();
</script>
